<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قفل‌شکن ریاضی</title>
<style>
:root{--bg:#e6f0f1;--ink:#1d2b36;--card:#fff;--line:#b9d3dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10222a;--ink:#e6f0f1;--card:#18313b;--line:#2f5563}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{max-width:520px;margin:0 auto;padding:6px 10px;display:flex;flex-direction:column;align-items:center;height:100dvh;box-sizing:border-box}
#top{width:100%;display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:16px}
#top>div{display:flex;gap:6px}
.ib{font-size:18px;width:40px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
#hearts{direction:ltr;font-size:14px}
#hint{font-size:14px;margin:3px 0 5px}
canvas#c{aspect-ratio:360/560;width:min(100%,calc((100dvh - 205px)*0.6429));height:auto;border-radius:16px;display:block}
#ctl{width:100%;display:flex;justify-content:space-between;direction:ltr;margin-top:8px}
#ctl div{display:flex;gap:10px}
.b{width:80px;height:58px;border-radius:18px;border:3px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:24px;touch-action:none}
.b.on{background:var(--line)}
#foot{font-size:11px;opacity:.7;margin-top:auto;padding-top:4px}
#pg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffd166,#ff8fab 50%,#5ad0f0);z-index:50;overflow:hidden;color:#1d2b36}
.fl{position:absolute;color:#fff;opacity:.4;font-weight:bold;animation:fl 8s ease-in-out infinite;pointer-events:none}
@keyframes fl{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-34px) rotate(22deg)}}
.pc{position:relative;width:92%;max-width:480px;max-height:86%;overflow:auto;background:rgba(255,255,255,.93);border-radius:24px;padding:18px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;box-sizing:border-box}
.pc .t{font-size:24px;font-weight:bold}
.tag{background:#ffe08a;border-radius:20px;padding:3px 14px;font-size:14px}
.qt{font-size:25px;line-height:2}
.e{font-size:17px;line-height:1.9;text-align:right}
.row{display:flex;gap:12px;width:100%}
.big{font:inherit;font-size:18px;padding:14px 12px;border-radius:16px;border:0;background:#2ec4f1;color:#052;cursor:pointer;width:100%;max-width:340px}
.big small{font-size:13px;opacity:.8}
.opt{flex:1;font-size:24px}
.opt:nth-child(1){background:#74c0fc}.opt:nth-child(2){background:#ffa94d}
.opts{display:flex;flex-direction:column;gap:10px;width:100%;align-items:center}
#cards{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.card{width:30%;min-width:96px;background:#eef7fb;border:2px solid #9fd3e6;border-radius:14px;color:#1d2b36;font:inherit;font-size:13px;padding:6px 2px;cursor:pointer}
.card canvas{width:64px;height:76px}
.ex{direction:ltr;unicode-bidi:isolate;display:inline-block}
.pf{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
#sp{position:fixed;inset:0;z-index:60;background:#0a3b8f;display:flex;align-items:center;justify-content:center;overflow:hidden}
#sp .w{--w:min(100vw,calc(100dvh*0.5581));position:relative;width:var(--w);aspect-ratio:768/1376}
#sp img{width:100%;height:100%;display:block}
#sp button{position:absolute;left:27.7%;top:73.4%;width:44.7%;height:6.4%;border:0;background:transparent;color:#0a3b8f;font:inherit;font-weight:bold;font-size:calc(var(--w)*.062);text-shadow:0 1px 0 #fff;cursor:pointer;animation:pl 1.4s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.07)}}
</style>
</head>
<body>
<div id="app">
 <div id="top"><div><button class="ib" id="bx">🏠</button><button class="ib" id="bm">🔊</button></div><span id="stage"></span><span id="hearts"></span></div>
 <div id="hint"></div>
 <canvas id="c" width="360" height="560"></canvas>
 <div id="ctl"><div><button class="b" id="bl">◀</button><button class="b" id="br">▶</button></div><button class="b" id="bj" style="width:130px;font-size:20px">⤒ پرش</button></div>

const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const AV=[
{n:'مریم میرزاخانی',hair:'#241812',st:'bob',skin:'#e9bf98',cloth:'#7a3b8f'},

{n:'محسن هشترودی',hair:'#d9d9d9',st:'bald',skin:'#ecc39c',cloth:'#7b5a2e',glass:1,must:1},
{n:'دکتر محمود حسابی',hair:'#f4f4f4',st:'short',skin:'#f0cba8',cloth:'#a33b3b',must:1}];
function face(c,a,cx,top,s){
 c.save();c.translate(cx,top);c.scale(s,s);
 c.fillStyle=a.cloth;c.fillRect(-11,26,22,16);c.fillStyle='#fff';c.fillRect(-3,26,6,9);
 c.fillStyle='#233';c.fillRect(-9,42,7,6);c.fillRect(2,42,7,6);
 if(a.st=='bob'){c.fillStyle=a.hair;c.beginPath();c.ellipse(0,15,15,15,0,0,7);c.fill();c.fillRect(-15,15,6,14);c.fillRect(9,15,6,14)}
 c.fillStyle=a.skin;c.beginPath();c.arc(0,14,12.5,0,7);c.fill();
 c.fillStyle=a.hair;
 if(a.st=='short'){c.beginPath();c.arc(0,12,13,Math.PI*1.05,Math.PI*1.95);c.fill();c.fillRect(-14,10,3,7);c.fillRect(11,10,3,7)}
 if(a.st=='bob'){c.beginPath();c.arc(0,12,13,Math.PI,2*Math.PI);c.fill()}
 if(a.st=='bald'){c.fillRect(-14,12,3,7);c.fillRect(11,12,3,7)}
 if(a.beard){c.fillStyle=a.hair;c.beginPath();c.arc(0,17,12.5,0.15,Math.PI-0.15);c.fill();c.fillStyle=a.skin;c.beginPath();c.arc(0,21,4,0,3.14);c.fill()}
 c.fillStyle='#222';c.beginPath();c.arc(-4.5,14,1.6,0,7);c.arc(4.5,14,1.6,0,7);c.fill();
 if(a.must){c.fillStyle=a.hair===('#f4f4f4')||a.hair==='#d9d9d9'?'#bbb':a.hair;c.fillRect(-5,19,10,2.5)}
 c.strokeStyle='#733';c.lineWidth=1.3;c.beginPath();c.arc(0,19,3.5,0.2,2.9);c.stroke();
 if(a.glass){c.strokeStyle='#222';c.lineWidth=1.2;c.beginPath();c.arc(-4.5,14,3.8,0,7);c.moveTo(12.3,14);c.arc(4.5,14,3.8,0,7);c.moveTo(-0.7,14);c.lineTo(0.7,14);c.stroke()}

let gs=[],G=7,B={},seen=new Set();
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const bag=a=>{let q=[];return()=>{if(!q.length)q=shuf(a.slice());return q.pop()}};
const sg=v=>v<0?'−'+fa(-v):fa(v),pr=v=>v<0?'('+sg(v)+')':sg(v),tm=v=>(v<0?'− ':'+ ')+fa(Math.abs(v));
const ex=s=>'<span class="ex">'+s+'</span>',pwr=(a,b)=>fa(a)+'<sup>'+fa(b)+'</sup>';
const Q=(cat,q,r,w,e)=>({cat,q,e,o:shuf([{t:r,ok:1},{t:w,ok:0}])});
const GN={
addSame(){const s=rnd(0,1)?1:-1,a=s*rnd(1,12),b=s*rnd(1,12),r=a+b;return Q('اعداد صحیح','حاصل '+ex(pr(a)+' + '+pr(b))+' کدام است؟',sg(r),sg(-r),'هم‌علامت‌اند؛ قدرمطلق‌ها را جمع می‌کنیم ('+fa(Math.abs(a))+' + '+fa(Math.abs(b))+' = '+fa(Math.abs(r))+') و علامت مشترک را می‌نویسیم: '+ex(sg(r)))},
addDiff(){let a,b;do{a=rnd(1,12);b=rnd(1,12)}while(a==b);if(rnd(0,1))a=-a;else b=-b;const r=a+b,hi=Math.max(Math.abs(a),Math.abs(b)),lo=Math.min(Math.abs(a),Math.abs(b));return Q('اعداد صحیح','حاصل '+ex(pr(a)+' + '+pr(b))+' کدام است؟',sg(r),sg(-r),'غیرهم‌علامت‌اند؛ قدرمطلق کوچک‌تر را از بزرگ‌تر کم می‌کنیم ('+fa(hi)+' − '+fa(lo)+' = '+fa(hi-lo)+') و علامت عددی را می‌گذاریم که قدرمطلقش بزرگ‌تر است: '+ex(sg(r)))},
sub(){let a,b,r,w;do{a=rnd(-12,12);b=rnd(-12,12);r=a-b;w=a+b}while(!a||!b||r==w);return Q('اعداد صحیح','حاصل '+ex(pr(a)+' − '+pr(b))+' کدام است؟',sg(r),sg(w),'تفریق یعنی جمع با قرینه: '+ex(pr(a)+' − '+pr(b)+' = '+pr(a)+' + '+pr(-b)+' = '+sg(r)))},
sqrt(){const r=rnd(2,15);let w;do{w=[r+1,r-1,r+2,Math.round(r*r/2)][rnd(0,3)]}while(w==r||w<1);return Q('جذر','مقدار '+ex('√'+fa(r*r))+' کدام است؟',fa(r),fa(w),fa(r)+' × '+fa(r)+' = '+fa(r*r)+'، پس '+ex('√'+fa(r*r)+' = '+fa(r)))},
between(){let n;do n=rnd(5,99);while(Math.sqrt(n)%1==0);const k=Math.floor(Math.sqrt(n)),w=k>2&&rnd(0,1)?[k-1,k]:[k+1,k+2];return Q('جذر',ex('√'+fa(n))+' بین کدام دو عدد صحیح متوالی است؟','بین '+fa(k)+' و '+fa(k+1),'بین '+fa(w[0])+' و '+fa(w[1]),fa(k)+'² = '+fa(k*k)+' و '+fa(k+1)+'² = '+fa((k+1)**2)+'؛ چون '+fa(n)+' بین این دو است، جذرش بین '+fa(k)+' و '+fa(k+1)+' است.')},

like(){let a,b;do{a=rnd(2,9);b=rnd(2,9)}while(0);return Q('جبر','ساده کن: '+ex(fa(a)+'x + '+fa(b)+'x'),ex(fa(a+b)+'x'),ex(fa(a+b)+'x²'),'جملات متشابه: فقط ضریب‌ها جمع می‌شوند ('+fa(a)+' + '+fa(b)+' = '+fa(a+b)+') و x همان x می‌ماند، نه x².')},
expand(){const k=rnd(2,6);let c;do c=rnd(-9,9);while(!c);return Q('جبر','ساده کن: '+ex(fa(k)+'(x '+tm(c)+')'),ex(fa(k)+'x '+tm(k*c)),ex(fa(k)+'x '+tm(c)),'ضریب بیرون پرانتز باید در هر دو جمله ضرب شود: '+ex(fa(k)+' × '+pr(c)+' = '+sg(k*c)))},
ident(){const a=rnd(1,6),s=rnd(0,1)?'+':'−';return Q('جبر','بسط بده: '+ex('(x '+s+' '+fa(a)+')²'),ex('x² '+s+' '+fa(2*a)+'x + '+fa(a*a)),ex('x² '+s+' '+fa(a*a)),'مربع دوجمله‌ای: جملهٔ وسط دو برابر حاصل‌ضرب دو جمله است: '+ex('۲ × x × '+fa(a)+' = '+fa(2*a)+'x')+' و نباید حذف شود.')},
lin1(){let x,a;do x=rnd(-9,9);while(!x);a=rnd(1,12)*(rnd(0,1)?1:-1);const b=x+a;return Q('معادله','جواب '+ex('x '+tm(a)+' = '+sg(b))+' کدام است؟',ex('x = '+sg(x)),ex('x = '+sg(b+a)),'از دو طرف '+ex(sg(a))+' را کم می‌کنیم: '+ex('x = '+sg(b)+' − '+pr(a)+' = '+sg(x)))},
lin2(){let x;do x=rnd(-9,9);while(!x);const a=rnd(2,9)*(rnd(0,1)?1:-1),b=a*x;return Q('معادله','جواب '+ex(sg(a)+'x = '+sg(b))+' کدام است؟',ex('x = '+sg(x)),ex('x = '+sg(-x)),'دو طرف را بر '+ex(sg(a))+' تقسیم می‌کنیم: '+ex('x = '+sg(b)+' ÷ '+pr(a)+' = '+sg(x)))},

function resetBags(){B={i:bag(['addSame','addDiff','sub']),p:bag(['pow','mulpow','powpow','divpow']),s:bag(['sqrt','between']),a:bag(['like','expand','ident']),e:bag(['lin1','lin2','lin3']),g8:bag(['sqrt','pow','mulpow','powpow','divpow','between']),c:bag(['i','p','s','a','e'])};seen=new Set()}
function gen(){let q,k=0;do{const f=G==7?B.i():G==8?B.g8():B[B.c()]();q=GN[f]();k++}while(seen.has(q.q)&&k<30);seen.add(q.q);return q}

// ---------- audio ----------
let AC=null,snd=true,mT=null,st=0;
const au=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume();return AC};
function tone(f,d,ty,v,t0,sl){if(!AC||!snd)return;const n=AC.currentTime+(t0||0),o=AC.createOscillator(),g=AC.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(sl,n+d);g.gain.setValueAtTime(v||.08,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d+.03)}
const sfx={jump:()=>tone(300,.18,'square',.06,0,720),star:()=>{tone(988,.08,'triangle',.14);tone(1319,.14,'triangle',.14,.07)},key:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.15,i*.08)),ok:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.15,i*.1)),bad:()=>{tone(220,.3,'sawtooth',.09,0,110);tone(160,.35,'sawtooth',.09,.15,80)},win:()=>[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.22,'triangle',.15,i*.1))};
const BS=[110,87.3,130.8,98],AR=[[440,523,659,784],[349,440,523,698],[523,659,784,1047],[392,494,587,784]];
function mus(){const bar=(st>>4)%4,s=st&15;if(s%4==0)tone(130,.12,'sine',.22,0,45);if(s%2==0)tone(BS[bar],.18,'triangle',.14);tone(AR[bar][s%4],.09,'square',.03);if(s%8==6)tone(1800,.04,'square',.015);st++}
function startMusic(){au();clearInterval(mT);st=0;mT=setInterval(mus,115)}
function stopMusic(){clearInterval(mT)}
// ---------- game ----------
let me=AV[0],lv=0,hearts=6,t=0,key=false,inv=0,over=true,msg=0,mt='',score=0,LV=null;
const P={x:20,y:GY-PH,vx:0,vy:0,on:true,d:1},inp={l:0,r:0,j:0};
const NP=[4,5,6,7,7],ND=[1,2,3,4,6];
function build(n){const np=NP[n],p=[],s=[],d=[];let k;
 for(let i=0;i<np;i++){const w=156-n*6,y=GY-62*(i+1),j=(i*13+n*7)%9;let px=i%2?W-w-10-j:10+j;p.push([px,y,w]);
  s.push({x:px+w*.12,y:y-24});if(i<np-1)s.push({x:px+w*.78,y:y-24});else k={x:px+w*.78,y:y-30};
  if(i>=1&&i<=ND[n])d.push({x:px+w*.45,y,done:false})}
 return{p,s,d,k}}
function load(n){lv=n;LV=build(n);key=false;P.x=20;P.y=GY-PH;P.vx=P.vy=0;inv=60;msg=0;hud()}
function hud(){$('stage').textContent='مرحلهٔ '+fa(lv+1)+' از '+fa(5);$('hearts').textContent='❤️'.repeat(hearts)+'🖤'.repeat(6-hearts);
 const r=LV?LV.d.filter(d=>!d.done).length:0;$('hint').textContent=(key?'🔑✓':'🔑')+' · '+(r?'🚪 '+fa(r)+' دروازه':'🚪 همه باز')+' · ⭐ '+fa(score)}
const pg=$('pg'),pc=$('pc');
function page(h){pc.innerHTML=h;pg.style.display='flex'}
function show(h,btn,fn){over=true;page('<div class="t">'+h+'</div><button class="big">'+btn+'</button>');pc.querySelector('button').onclick=()=>{pg.style.display='none';fn()}}
function fb(h,e,btn,fn){page('<div class="t">'+h+'</div><div class="e">'+e+'</div><button class="big">'+btn+'</button>');pc.querySelector('button').onclick=()=>{pg.style.display='none';fn()}}
function grade(){stopMusic();over=true;page('<div class="t" style="font-size:28px;line-height:1.7">🔓 قفل‌شکن ریاضی 🔑</div><div style="font-size:15px;line-height:1.9;color:#555">پاسخ درست بده، دروازه‌ها را یکی یکی باز کن و کلید اصلی را به دست بیاور</div><div class="tag">پایهٔ خودت را انتخاب کن</div><div class="opts"></div>');
 const bx=pc.querySelector('.opts');
 [[7,'پایهٔ هفتم','جمع و تفریق اعداد صحیح'],[8,'پایهٔ هشتم','توان و جذر'],[9,'پایهٔ نهم','ترکیبی: صحیح، توان و جذر، جبر، معادله']].forEach(([g,tt,s])=>{const b=document.createElement('button');b.className='big';b.innerHTML=tt+'<br><small>'+s+'</small>';b.onclick=()=>{G=g;resetBags();menu()};bx.appendChild(b)})}
function menu(){over=true;page('<div class="t">شخصیت خودت را انتخاب کن</div><div id="cards"></div>');
 const cs=$('cards');
 AV.forEach(a=>{const b=document.createElement('button');b.className='card';const k=document.createElement('canvas');k.width=128;k.height=152;
  face(k.getContext('2d'),a,64,6,2.9);b.appendChild(k);b.appendChild(document.createElement('br'));b.appendChild(document.createTextNode(a.n));
  b.onclick=()=>{me=a;pg.style.display='none';hearts=6;score=0;au();startMusic();load(0);over=false};cs.appendChild(b)})}
function push(d){const dir=P.x+PW/2>d.x?1:-1;P.x=Math.max(0,Math.min(W-PW,dir>0?d.x+14+26:d.x-14-PW-26));P.vx=0}
function ask(d){over=true;inp.l=inp.r=inp.j=0;const q=gen();
 page('<div class="tag">🚪 '+q.cat+'</div><div class="qt">'+q.q+'</div><div class="row"></div>');
 const bx=pc.querySelector('.row');
 q.o.forEach(o=>{const b=document.createElement('button');b.className='big opt';b.innerHTML=ex(o.t);b.onclick=()=>{
  if(o.ok){d.done=true;sfx.ok();hud();fb('✅ درست گفتی!',q.e,'ادامه',()=>{over=false})}
  else{hearts--;sfx.bad();hud();push(d);fb('❌ نادرست؛ یک جان کم شد','پاسخ درست: '+ex(q.o.find(z=>z.ok).t)+'<br>'+q.e,'ادامه',()=>{if(hearts<=0)show('😢 جان‌هایت تمام شد','برگشت به صفحهٔ اول',grade);else over=false})}};bx.appendChild(b)})}
function step(){t++;if(inv>0)inv--;if(msg>0)msg--;const lev=LV;
 P.vx=(inp.r-inp.l)*3.2;if(P.vx)P.d=P.vx>0?1:-1;
 if(inp.j&&P.on){P.vy=-10.5;P.on=false;sfx.jump()}
 P.vy+=.5;P.x=Math.max(0,Math.min(W-PW,P.x+P.vx));
 const pb=P.y+PH;P.y+=P.vy;const nb=P.y+PH;P.on=false;
 if(P.vy>=0){for(const [px,py,pw] of lev.p){if(P.x+PW>px&&P.x<px+pw&&pb<=py+1&&nb>=py){P.y=py-PH;P.vy=0;P.on=true}}
  if(nb>=GY){P.y=GY-PH;P.vy=0;P.on=true}}
 if(P.y<0){P.y=0;P.vy=0}
 const cx=P.x+PW/2,cy=P.y+PH/2;
 for(const s of lev.s)if(!s.got&&Math.abs(cx-s.x)<22&&Math.abs(cy-s.y)<30){s.got=1;score++;sfx.star();hud()}
 if(!key&&Math.abs(cx-lev.k.x)<24&&Math.abs(cy-lev.k.y)<32){key=true;sfx.key();hud()}
 for(const d of lev.d)if(!d.done&&P.x+PW>d.x-14&&P.x<d.x+14&&P.y+PH>d.y-50&&P.y<d.y){ask(d);return}
 if(P.x>298&&P.y>GY-70){
  if(!key){msg=70;mt='اول کلید را پیدا کن!'}
  else if(lev.d.some(d=>!d.done)){msg=70;mt='همهٔ دروازه‌ها را باز کن!'}
  else{over=true;sfx.win();if(lv==4)show('🎉 آفرین! همهٔ مرحله‌ها را تمام کردی<br>⭐ '+fa(score),'بازی دوباره',grade);else show('✅ مرحله تمام شد','مرحلهٔ بعد',()=>{load(lv+1);over=false})}}}
function rr(a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.fill()}
function draw(){const lev=LV;if(!lev)return;
 const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#9fe0f2');g.addColorStop(1,'#3f9db5');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.strokeStyle='rgba(255,255,255,.2)';x.lineWidth=1;for(let i=0;i<W;i+=60){x.beginPath();x.moveTo(i,0);x.lineTo(i,GY);x.stroke()}for(let j=0;j<GY;j+=60){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}
 x.fillStyle='rgba(255,255,255,.3)';x.font='bold 28px Tahoma';x.textAlign='center';['+','−','×','÷','√','π','%'].forEach((s,i)=>x.fillText(s,30+i*50,70+(i*97)%400));
 x.fillStyle='#7aa6b6';x.fillRect(0,GY,W,50);x.fillStyle='#e3f2f7';x.fillRect(0,GY,W,3);
 for(const [px,py,pw] of lev.p){x.fillStyle='#f1f9fb';x.fillRect(px,py,pw,10);x.fillStyle='#5f8fa1';x.fillRect(px,py+8,pw,3)}
 for(const d of lev.d){x.fillStyle=d.done?'rgba(46,204,143,.35)':'#ff9f1c';rr(d.x-14,d.y-50,28,50,5);x.strokeStyle=d.done?'#1ea064':'#b35c00';x.lineWidth=2;x.strokeRect(d.x-14,d.y-50,28,50);
  if(!d.done){x.fillStyle='#fff';x.beginPath();x.arc(d.x,d.y-25,10,0,7);x.fill();x.fillStyle='#d9480f';x.font='bold 16px Tahoma';x.fillText('؟',d.x,d.y-19)}}
 x.font='24px serif';for(const s of lev.s)if(!s.got)x.fillText('⭐',s.x,s.y+8+Math.sin(t/10+s.x)*3);
 if(!key){x.font='28px serif';x.shadowColor='#ffd84a';x.shadowBlur=12;x.fillText('🔑',lev.k.x,lev.k.y+8+Math.sin(t/12)*3);x.shadowBlur=0}
 x.fillStyle='#7c5cff';rr(302,GY-64,36,64,6);x.fillStyle='#2a1b6b';x.fillRect(309,GY-56,22,12);x.font='20px serif';x.fillText(key&&!lev.d.some(d=>!d.done)?'🔓':'🔒',320,GY-18);
 if(!over&&(inv%8<4||!inv)){x.save();x.translate(P.x+PW/2,P.y-6);if(P.d<0)x.scale(-1,1);face(x,me,0,0,1.15);x.restore()}
 if(msg>0){x.fillStyle='rgba(0,0,0,.65)';rr(40,16,280,38,12);x.fillStyle='#fff';x.font='bold 16px Tahoma';x.fillText(mt,180,41)}}
function loop(){if(!over)step();draw();requestAnimationFrame(loop)}
function bind(id,k){const e=$(id);const s=v=>ev=>{ev.preventDefault();inp[k]=v;e.classList.toggle('on',!!v)};
 e.addEventListener('pointerdown',s(1));['pointerup','pointercancel','pointerleave'].forEach(n=>e.addEventListener(n,s(0)))}
bind('bl','l');bind('br','r');bind('bj','j');
$('bx').onclick=()=>grade();
$('bm').onclick=()=>{snd=!snd;$('bm').textContent=snd?'🔊':'🔇'};
const km={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'j',' ':'j'};
addEventListener('keydown',e=>{if(km[e.key]){inp[km[e.key]]=1;e.preventDefault()}});
addEventListener('keyup',e=>{if(km[e.key])inp[km[e.key]]=0});
['+','−','×','÷','√','π','x²','∑','%','=','∞','؟','½','³'].forEach((s,i)=>{const e=document.createElement('span');e.className='fl';e.textContent=s;e.style.cssText='left:'+(5+(i*37)%88)+'%;top:'+(4+(i*53)%84)+'%;font-size:'+(26+(i*7)%30)+'px;animation-delay:-'+(i%7)+'s';pg.insertBefore(e,pc)});
